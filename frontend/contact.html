<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | AFLAH STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/global.css">
    <style>
        .contact-section {
            padding: 150px 5% 5rem;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        
        .contact-section h1 {
            font-family: var(--font-heading);
            color: var(--color-gold);
            font-size: 3.5rem;
            margin-bottom: 1rem;
        }
        
        .contact-info-box {
            background-color: var(--color-bg-secondary);
            padding: 4rem 2rem;
            border-radius: 8px;
            border-top: 4px solid var(--color-gold);
            margin-top: 3rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        
        .info-item {
            margin-bottom: 2.5rem;
        }
        
        .info-item i {
            font-size: 2.5rem;
            color: var(--color-gold);
            margin-bottom: 1rem;
        }
        
        .info-item h3 {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        
        .info-item p {
            font-size: 1.2rem;
            color: var(--color-text-muted);
        }
        
        .info-item a {
            color: var(--color-gold);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <header class="navbar" style="background-color: var(--color-bg-primary); padding-bottom: 1rem;">
        <div class="logo">AFLAH <span>STORE</span></div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="contact.html" style="color: var(--color-gold);">Contact</a></li>
                <li><a href="cart.html"><i class="fa-solid fa-cart-shopping"></i> Cart</a></li>
            </ul>
        </nav>
    </header>

    <section class="contact-section">
        <h1>Get In Touch</h1>
        <p style="color: var(--color-text-muted); font-size: 1.1rem;">Visit our showroom or call us directly to inquire about our exclusive luxury timepieces.</p>
        
        <div class="contact-info-box">
            <div class="info-item">
                <i class="fa-solid fa-location-dot"></i>
                <h3>Showroom Location</h3>
                <p>Eden Orchard<br>Faisalabad, Pakistan</p>
            </div>
            
            <div class="info-item">
                <i class="fa-solid fa-phone"></i>
                <h3>Phone & WhatsApp</h3>
                <p><a href="tel:03433467891">0343 3467891</a></p>
                <p style="font-size: 0.9rem; margin-top: 0.5rem;">For Easypaisa/Jazzcash orders, please use: <strong>0343-3467891</strong></p>
            </div>
        </div>
    </section>
<!-- Floating WhatsApp Button -->
<a href="https://wa.me/923433467891" class="whatsapp-btn" target="_blank" aria-label="Chat on WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>
<script src="js/cursor.js"></script>
</body>
</html>
