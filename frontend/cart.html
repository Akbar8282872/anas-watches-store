<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | Anas Watches</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/global.css">
    <style>
        .cart-section {
            padding: 150px 5% 5rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .cart-header {
            font-family: var(--font-heading);
            color: var(--color-gold);
            font-size: 2.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid #333;
            padding-bottom: 1rem;
        }
        
        .cart-container {
            display: flex;
            gap: 3rem;
        }
        
        .cart-items {
            flex: 2;
        }
        
        .cart-item {
            display: flex;
            align-items: center;
            background-color: var(--color-bg-secondary);
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 8px;
        }
        
        .cart-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border: 1px solid var(--color-gold);
            margin-right: 1.5rem;
        }
        
        .item-details h3 {
            font-family: var(--font-heading);
            margin-bottom: 0.5rem;
        }
        
        .item-price {
            color: var(--color-gold);
            font-weight: 600;
        }
        
        .remove-btn {
            margin-left: auto;
            color: #e74c3c;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
        }
        
        .cart-summary {
            flex: 1;
            background-color: var(--color-bg-secondary);
            padding: 2rem;
            border-radius: 8px;
            height: fit-content;
        }
        
        .cart-summary h3 {
            margin-bottom: 1.5rem;
            font-family: var(--font-heading);
            color: var(--color-gold);
        }
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            color: var(--color-text-muted);
        }
        
        .summary-total {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid #333;
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--color-text-light);
        }
        
        .checkout-btn {
            width: 100%;
            background-color: var(--color-gold);
            color: #000;
            border: none;
            padding: 1rem;
            margin-top: 2rem;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            border-radius: 4px;
        }
        
        .checkout-btn:hover {
            background-color: var(--color-gold-hover);
        }
        
        /* Checkout Form Modal (Hidden by default) */
        .checkout-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: var(--color-bg-primary);
            padding: 3rem;
            border: 2px solid var(--color-gold);
            border-radius: 8px;
            width: 100%;
            max-width: 500px;
        }
        
        .modal-content h2 {
            color: var(--color-gold);
            margin-bottom: 1.5rem;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--color-text-muted);
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 0.8rem;
            background-color: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
        }
        
        .payment-info {
            background-color: rgba(212, 175, 55, 0.1);
            padding: 1rem;
            border-left: 3px solid var(--color-gold);
            margin-top: 1rem;
            font-size: 0.9rem;
            display: none; /* Shown if easypaisa/jazzcash selected */
        }
    </style>
</head>
<body>
    <header class="navbar" style="background-color: var(--color-bg-primary); padding-bottom: 1rem;">
        <div class="logo">ANAS <span>WATCHES</span></div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="cart.html" style="color: var(--color-gold);"><i class="fa-solid fa-cart-shopping"></i> Cart</a></li>
                <li><a href="admin/dashboard.html"><i class="fa-solid fa-user"></i> Admin</a></li>
            </ul>
        </nav>
    </header>

    <section class="cart-section">
        <h1 class="cart-header">Your Shopping Cart</h1>
        
        <div class="cart-container">
            <div class="cart-items" id="cartItemsContainer">
                <!-- Cart items injected via JS -->
            </div>
            
            <div class="cart-summary">
                <h3>Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">Rs. 0</span>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <span>Free</span>
                </div>
                <div class="summary-total">
                    <span>Total</span>
                    <span id="total">Rs. 0</span>
                </div>
                <button class="checkout-btn" onclick="openCheckout()">Proceed to Checkout</button>
            </div>
        </div>
    </section>

    <!-- Checkout Modal -->
    <div class="checkout-modal" id="checkoutModal">
        <div class="modal-content">
            <h2>Checkout</h2>
            <form id="checkoutForm" onsubmit="submitOrder(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>Shipping Address</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>Payment Method</label>
                    <select id="paymentMethod" onchange="togglePaymentInfo()" required>
                        <option value="COD">Cash on Delivery (COD)</option>
                        <option value="Easypaisa">Easypaisa</option>
                        <option value="Jazzcash">Jazzcash</option>
                    </select>
                </div>
                
                <div class="payment-info" id="paymentInfo">
                    Please send the total amount to <strong>0370-6178733</strong>.<br><br>
                    <label>Transaction Reference ID:</label>
                    <input type="text" id="trxId" placeholder="Enter Ref #">
                </div>
                
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="checkout-btn" style="background-color: transparent; border: 1px solid var(--color-gold); color: var(--color-gold);" onclick="closeCheckout()">Cancel</button>
                    <button type="submit" class="checkout-btn" style="margin-top: 0;">Place Order</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function loadCart() {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            const container = document.getElementById("cartItemsContainer");
            const subtotalEl = document.getElementById("subtotal");
            const totalEl = document.getElementById("total");
            
            if (cart.length === 0) {
                container.innerHTML = "<p>Your cart is empty.</p>";
                subtotalEl.innerText = "Rs. 0";
                totalEl.innerText = "Rs. 0";
                return;
            }
            
            let html = "";
            let total = 0;
            
            cart.forEach((item, index) => {
                total += item.price;
                html += `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.name}">
                        <div class="item-details">
                            <h3>${item.name}</h3>
                            <div class="item-price">Rs. ${item.price.toLocaleString()}</div>
                        </div>
                        <button class="remove-btn" onclick="removeItem(${index})"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            subtotalEl.innerText = `Rs. ${total.toLocaleString()}`;
            totalEl.innerText = `Rs. ${total.toLocaleString()}`;
        }
        
        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            cart.splice(index, 1);
            localStorage.setItem("cart", JSON.stringify(cart));
            loadCart();
        }
        
        function openCheckout() {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            if(cart.length === 0) return alert("Cart is empty!");
            document.getElementById('checkoutModal').style.display = 'flex';
        }
        
        function closeCheckout() {
            document.getElementById('checkoutModal').style.display = 'none';
        }
        
        function togglePaymentInfo() {
            const method = document.getElementById("paymentMethod").value;
            const info = document.getElementById("paymentInfo");
            if(method === "Easypaisa" || method === "Jazzcash") {
                info.style.display = "block";
                document.getElementById("trxId").required = true;
            } else {
                info.style.display = "none";
                document.getElementById("trxId").required = false;
            }
        }
        
        function submitOrder(e) {
            e.preventDefault();
            
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            if(cart.length === 0) return alert("Cart is empty!");
            
            let total = cart.reduce((sum, item) => sum + item.price, 0);
            const name = e.target.querySelector('input[type="text"]').value;
            const address = e.target.querySelectorAll('input[type="text"]')[1].value;
            const method = document.getElementById("paymentMethod").value;
            const trxId = document.getElementById("trxId").value;
            
            const newOrder = {
                orderId: 'ORD-' + Math.floor(Math.random() * 90000 + 10000),
                name: name,
                address: address,
                method: method,
                trxId: trxId,
                total: total,
                status: 'Pending Verification',
                items: cart
            };
            
            let orders = JSON.parse(localStorage.getItem('orders')) || [];
            orders.push(newOrder);
            localStorage.setItem('orders', JSON.stringify(orders));
            
            alert("Order placed successfully! The admin will verify your order shortly.");
            localStorage.removeItem("cart");
            closeCheckout();
            loadCart();
        }

        document.addEventListener("DOMContentLoaded", loadCart);
    </script>
</body>
</html>
