<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | AFLAH STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/global.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-image: radial-gradient(circle, rgba(212,175,55,0.05) 0%, rgba(10,10,10,1) 100%);
        }
        
        .login-box {
            background-color: var(--color-bg-secondary);
            padding: 3rem;
            border-radius: 8px;
            border: 1px solid var(--color-gold);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
        }
        
        .login-box h2 {
            font-family: var(--font-heading);
            color: var(--color-gold);
            margin-bottom: 2rem;
            font-size: 2rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--color-text-muted);
            font-size: 0.9rem;
        }
        
        .form-group input {
            width: 100%;
            padding: 1rem;
            background-color: var(--color-bg-primary);
            border: 1px solid #333;
            color: var(--color-text-light);
            border-radius: 4px;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--color-gold);
        }
        
        .btn-login {
            width: 100%;
            padding: 1rem;
            background-color: var(--color-gold);
            color: #000;
            border: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 1rem;
        }
        
        .btn-login:hover {
            background-color: var(--color-gold-hover);
        }
        
        .back-link {
            display: block;
            margin-top: 2rem;
            color: var(--color-text-muted);
            text-decoration: none;
            font-size: 0.9rem;
        }
        .back-link:hover {
            color: var(--color-gold);
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Admin Access</h2>
        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="Enter admin email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn-login">Login Securely</button>
        </form>
        <a href="../index.html" class="back-link">&larr; Back to Store</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        
        // Import config from your existing file (or paste here if preferred, but since it's an inline script, we just declare it)
        const firebaseConfig = {
          apiKey: "AIzaSyD1UHj3tRfjpknCW5LyxzVpBMuORjQw8Yo",
          authDomain: "anas-watches.firebaseapp.com",
          projectId: "anas-watches",
          storageBucket: "anas-watches.firebasestorage.app",
          messagingSenderId: "969091370398",
          appId: "1:969091370398:web:9963897ef56c5f76eb1a8f",
          measurementId: "G-7L6G6JWPVH"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const btn = document.querySelector('.btn-login');
            
            btn.textContent = "Verifying...";
            btn.disabled = true;
            
            try {
                await signInWithEmailAndPassword(auth, email, pass);
                // Auth successful
                localStorage.setItem('adminLoggedIn', 'true');
                window.location.href = 'dashboard.html';
            } catch (error) {
                alert('Access Denied: Invalid Credentials!');
                btn.textContent = "Login Securely";
                btn.disabled = false;
            }
        });
    </script>
<script src="../js/cursor.js"></script>
</body>
</html>
