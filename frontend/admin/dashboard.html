<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | AFLAH STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/global.css">
    <script>
        // Security Check
        if(localStorage.getItem('adminLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }
        function logout() {
            localStorage.removeItem('adminLoggedIn');
            window.location.href = 'login.html';
        }
    </script>
    <style>
        .admin-layout { display: flex; min-height: 100vh; padding-top: 80px; }
        .sidebar { width: 250px; background-color: #111; padding: 2rem; border-right: 1px solid #333; }
        .sidebar ul { list-style: none; }
        .sidebar li { margin-bottom: 1.5rem; }
        .sidebar a { color: var(--color-text-muted); text-decoration: none; font-size: 1.1rem; cursor: pointer; }
        .sidebar a:hover, .sidebar a.active { color: var(--color-gold); }
        .main-content { flex: 1; padding: 3rem 5%; }
        
        .dashboard-card {
            background-color: #1a1a1a;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid #333;
            margin-bottom: 3rem;
        }
        
        .orders-table { width: 100%; border-collapse: collapse; }
        .orders-table th, .orders-table td { padding: 1rem; text-align: left; border-bottom: 1px solid #333; }
        .orders-table th { color: var(--color-gold); font-weight: 600; }
        
        .btn-action { background-color: var(--color-gold); color: #000; border: none; padding: 0.5rem 1rem; cursor: pointer; border-radius: 4px; font-weight: 600; }
        .btn-danger { background-color: #e74c3c; color: #fff; border: none; padding: 0.5rem 1rem; cursor: pointer; border-radius: 4px; font-weight: 600; }
        
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--color-gold); }
        .form-group input, .form-group select { width: 100%; padding: 0.8rem; background: #000; border: 1px solid #333; color: #fff; border-radius: 4px;}
        .form-row { display: flex; gap: 1rem; }
        .form-row .form-group { flex: 1; }
    </style>
</head>
<body>
    <header class="navbar" style="background-color: var(--color-bg-primary); padding-bottom: 1rem;">
        <div class="logo">AFLAH <span>STORE</span> | ADMIN</div>
        <nav>
            <ul>
                <li><a href="../index.html">Back to Store</a></li>
                <li><a onclick="logout()" style="color: var(--color-gold); cursor: pointer;">Logout</a></li>
            </ul>
        </nav>
    </header>

    <div class="admin-layout">
        <aside class="sidebar">
            <ul>
                <li><a onclick="switchTab('orders')" id="tab-orders" class="active">Real-Time Orders</a></li>
                <li><a onclick="switchTab('products')" id="tab-products">Manage Products</a></li>
                <li><a onclick="switchTab('add')" id="tab-add">Add Product</a></li>
            </ul>
        </aside>
        
        <main class="main-content">
            <!-- ORDERS VIEW -->
            <div id="view-orders" class="dashboard-card">
                <h2 style="color: var(--color-gold); margin-bottom: 1.5rem;">Recent Orders</h2>
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>Order ID</th><th>Customer</th><th>Phone</th><th>Address</th><th>Items (Images)</th><th>Method</th><th>Total</th><th>Status</th><th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="ordersBody"></tbody>
                </table>
            </div>

            <!-- MANAGE PRODUCTS VIEW -->
            <div id="view-products" class="dashboard-card" style="display: none;">
                <h2 style="color: var(--color-gold); margin-bottom: 1.5rem;">Manage Added Products</h2>
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>Image</th><th>Name</th><th>Price</th><th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="productsBody"></tbody>
                </table>
            </div>

            <!-- ADD PRODUCT VIEW -->
            <div id="view-add" class="dashboard-card" style="display: none; max-width: 600px;">
                <h2 style="color: var(--color-gold); margin-bottom: 1.5rem;">Add New Product</h2>
                <form id="addProductForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Watch Brand (e.g. Rolex)</label>
                            <input type="text" id="pBrand" required>
                        </div>
                        <div class="form-group">
                            <label>Watch Model/Color</label>
                            <input type="text" id="pModel" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Price (PKR)</label>
                        <input type="number" id="pPrice" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Image Source Type</label>
                        <select id="imageType" onchange="toggleImageInput()">
                            <option value="url">Paste Image URL</option>
                            <option value="file">Upload from Gallery</option>
                        </select>
                    </div>
                    
                    <div class="form-group" id="urlInputGroup">
                        <label>Image URL</label>
                        <input type="url" id="pImage" placeholder="https://...">
                    </div>
                    
                    <div class="form-group" id="fileInputGroup" style="display: none;">
                        <label>Upload Image (Gallery)</label>
                        <input type="file" id="pFile" accept="image/*">
                    </div>
                    
                    <button type="submit" class="btn-action" style="width: 100%; padding: 1rem; margin-top: 1rem;">Publish to Store</button>
                </form>
            </div>
        </main>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, addDoc, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyD1UHj3tRfjpknCW5LyxzVpBMuORjQw8Yo",
          authDomain: "anas-watches.firebaseapp.com",
          projectId: "anas-watches",
          storageBucket: "anas-watches.firebasestorage.app",
          messagingSenderId: "969091370398",
          appId: "1:969091370398:web:9963897ef56c5f76eb1a8f",
          measurementId: "G-7L6G6JWPVH"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Tab Switching logic
        window.switchTab = function(tab) {
            document.querySelectorAll('.dashboard-card').forEach(c => c.style.display = 'none');
            document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
            document.getElementById(`view-${tab}`).style.display = 'block';
            document.getElementById(`tab-${tab}`).classList.add('active');
        }

        window.toggleImageInput = function() {
            const type = document.getElementById('imageType').value;
            document.getElementById('urlInputGroup').style.display = type === 'url' ? 'block' : 'none';
            document.getElementById('fileInputGroup').style.display = type === 'file' ? 'block' : 'none';
        }

        // FIREBASE: Real-time orders
        onSnapshot(collection(db, "orders"), (snapshot) => {
            const tbody = document.getElementById('ordersBody');
            if(snapshot.empty) return tbody.innerHTML = '<tr><td colspan="9">No active orders.</td></tr>';
            
            let html = '';
            snapshot.forEach(docSnap => {
                const o = docSnap.data();
                // Fix image path: relative paths need ../ prefix (dashboard is in admin/ subfolder)
                const itemImgs = (o.items || []).map(item => {
                    const src = (item.image && (item.image.startsWith('http') || item.image.startsWith('data:')))
                        ? item.image
                        : '../' + item.image;
                    return `
                    <div style="display:inline-block; text-align:center; margin:3px;">
                        <img src="${src}" alt="${item.name}" title="${item.name}"
                             style="width:55px;height:55px;object-fit:cover;border-radius:4px;border:1px solid #c9a84c;"
                             onerror="this.style.background='#333';this.alt='No img';">
                        <div style="font-size:0.65rem;color:#aaa;max-width:60px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${item.name}</div>
                    </div>`;
                }).join('');
                html += `
                    <tr>
                        <td>${o.orderId}</td><td>${o.name}</td><td>${o.phone || '—'}</td><td>${o.address}</td>
                        <td>${itemImgs}</td>
                        <td>${o.method} ${o.trxId ? '<br><small>Ref: '+o.trxId+'</small>' : ''}</td>
                        <td>Rs. ${o.total.toLocaleString()}</td>
                        <td style="color: ${o.status === 'Verified' ? '#2ecc71' : '#e74c3c'}">${o.status}</td>
                        <td style="white-space: nowrap;">
                            ${o.status !== 'Verified' ? `<button class="btn-action" onclick="verifyOrder('${docSnap.id}')" style="margin-right: 5px; font-size: 0.8rem; padding: 0.4rem 0.8rem;">Verify</button>` : '<span style="color: #2ecc71; margin-right: 5px;">Shipping...</span>'}
                            <button class="btn-danger" onclick="deleteOrder('${docSnap.id}')" style="font-size: 0.8rem; padding: 0.4rem 0.8rem;"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        });

        window.verifyOrder = async function(docId) {
            await updateDoc(doc(db, "orders", docId), { status: 'Verified' });
        }

        window.deleteOrder = async function(docId) {
            if(!confirm('Are you sure you want to delete this order?')) return;
            await deleteDoc(doc(db, "orders", docId));
        }

        // FIREBASE: Real-time products
        onSnapshot(collection(db, "adminProducts"), (snapshot) => {
            const tbody = document.getElementById('productsBody');
            if(snapshot.empty) return tbody.innerHTML = '<tr><td colspan="4">No custom products added yet.</td></tr>';
            
            let html = '';
            snapshot.forEach(docSnap => {
                const p = docSnap.data();
                html += `
                    <tr>
                        <td><img src="${p.image}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 4px;"></td>
                        <td>${p.name}</td>
                        <td>Rs. ${p.price.toLocaleString()}</td>
                        <td><button class="btn-danger" onclick="deleteProduct('${docSnap.id}')">Delete</button></td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        });

        window.deleteProduct = async function(docId) {
            if(!confirm('Are you sure you want to remove this product from the store?')) return;
            await deleteDoc(doc(db, "adminProducts", docId));
            alert('Product removed!');
        }

        // FIREBASE: Add Product
        document.getElementById('addProductForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const brand = document.getElementById('pBrand').value;
            const model = document.getElementById('pModel').value;
            const price = parseInt(document.getElementById('pPrice').value);
            const imageType = document.getElementById('imageType').value;
            
            if (imageType === 'url') {
                saveProduct(brand, model, price, document.getElementById('pImage').value || 'assets/200.jpg');
            } else {
                const fileInput = document.getElementById('pFile');
                if (!fileInput.files[0]) return alert("Please select an image from your gallery.");
                
                const reader = new FileReader();
                reader.onload = function(event) {
                    saveProduct(brand, model, price, event.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            }
        });
        
        async function saveProduct(brand, model, price, imageSrc) {
            const newProduct = {
                name: `${brand} ${model}`,
                price: price,
                rating: "5.0",
                image: imageSrc
            };
            await addDoc(collection(db, "adminProducts"), newProduct);
            
            alert('Product added securely to cloud database!');
            document.getElementById('addProductForm').reset();
            switchTab('products');
        }
    </script>
<script src="../js/cursor.js"></script>
</body>
</html>
