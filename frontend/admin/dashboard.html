<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Anas Watches</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/global.css">
    <script>
        // Security Check
        if(localStorage.getItem('adminLoggedIn') !== 'true') {
            window.location.href = 'login.html';
        }
        
        function logout() {
            localStorage.removeItem('adminLoggedIn');
            window.location.href = 'login.html';
        }
    </script>
    <style>
        .admin-layout {
            display: flex;
            min-height: 100vh;
            padding-top: 80px;
        }
        
        .sidebar {
            width: 250px;
            background-color: #111;
            padding: 2rem;
            border-right: 1px solid #333;
        }
        
        .sidebar ul { list-style: none; }
        .sidebar li { margin-bottom: 1.5rem; }
        .sidebar a {
            color: var(--color-text-muted);
            text-decoration: none;
            font-size: 1.1rem;
            transition: color 0.3s;
            cursor: pointer;
        }
        .sidebar a:hover, .sidebar a.active { color: var(--color-gold); }
        
        .main-content {
            flex: 1;
            padding: 3rem 5%;
        }
        
        .orders-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 3rem;
        }
        .orders-table th, .orders-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #333;
        }
        .orders-table th { color: var(--color-gold); font-weight: 600; }
        
        .btn-verify {
            background-color: var(--color-gold);
            color: #000;
            border: none;
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 4px;
            font-weight: 600;
        }
        
        .add-product-form {
            background-color: #1a1a1a;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid #333;
            max-width: 600px;
        }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--color-gold); }
        .form-group input { width: 100%; padding: 0.8rem; background: #000; border: 1px solid #333; color: #fff; }
    </style>
</head>
<body>
    <header class="navbar" style="background-color: var(--color-bg-primary); padding-bottom: 1rem;">
        <div class="logo">ANAS <span>WATCHES</span> | ADMIN</div>
        <nav>
            <ul>
                <li><a href="../index.html">Back to Store</a></li>
                <li><a onclick="logout()" style="color: var(--color-gold); cursor: pointer;">Logout</a></li>
            </ul>
        </nav>
    </header>

    <div class="admin-layout">
        <aside class="sidebar">
            <ul>
                <li><a class="active">Dashboard</a></li>
            </ul>
        </aside>
        
        <main class="main-content">
            <h1 style="font-family: var(--font-heading); color: var(--color-gold); margin-bottom: 2rem;">Real-Time Orders</h1>
            
            <table class="orders-table">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Customer</th>
                        <th>Address</th>
                        <th>Method</th>
                        <th>Total Amount</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="ordersBody">
                    <!-- Loaded dynamically -->
                </tbody>
            </table>
            
            <h2 style="font-family: var(--font-heading); color: var(--color-gold); margin-bottom: 1.5rem;">Add New Product to Store</h2>
            <div class="add-product-form">
                <form id="addProductForm">
                    <div class="form-group">
                        <label>Watch Brand (e.g. Rolex)</label>
                        <input type="text" id="pBrand" required>
                    </div>
                    <div class="form-group">
                        <label>Watch Model/Color</label>
                        <input type="text" id="pModel" required>
                    </div>
                    <div class="form-group">
                        <label>Price (PKR)</label>
                        <input type="number" id="pPrice" required>
                    </div>
                    <div class="form-group">
                        <label>Image URL</label>
                        <input type="text" id="pImage" required placeholder="https://...">
                    </div>
                    <button type="submit" class="btn-verify" style="margin-top: 1rem; width: 100%;">Upload Product</button>
                </form>
            </div>
        </main>
    </div>

    <script>
        // Load real orders from localStorage
        function loadOrders() {
            const orders = JSON.parse(localStorage.getItem('orders')) || [];
            const tbody = document.getElementById('ordersBody');
            
            if(orders.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">No active orders found.</td></tr>';
                return;
            }
            
            let html = '';
            orders.forEach((o, index) => {
                html += `
                    <tr>
                        <td>${o.orderId}</td>
                        <td>${o.name}</td>
                        <td>${o.address}</td>
                        <td>${o.method} ${o.trxId ? '<br><small>Ref: '+o.trxId+'</small>' : ''}</td>
                        <td>Rs. ${o.total.toLocaleString()}</td>
                        <td style="color: ${o.status === 'Verified' ? '#2ecc71' : '#e74c3c'}">${o.status}</td>
                        <td>
                            ${o.status !== 'Verified' ? `<button class="btn-verify" onclick="verifyOrder(${index})">Verify Payment</button>` : 'Shipping...'}
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function verifyOrder(index) {
            let orders = JSON.parse(localStorage.getItem('orders')) || [];
            orders[index].status = 'Verified';
            localStorage.setItem('orders', JSON.stringify(orders));
            loadOrders();
        }

        // Add Product Form Logic
        document.getElementById('addProductForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const brand = document.getElementById('pBrand').value;
            const model = document.getElementById('pModel').value;
            const price = parseInt(document.getElementById('pPrice').value);
            const image = document.getElementById('pImage').value;
            
            const newProduct = {
                id: Date.now(),
                name: `${brand} ${model}`,
                price: price,
                rating: "5.0",
                image: image
            };
            
            let customProducts = JSON.parse(localStorage.getItem('adminProducts')) || [];
            customProducts.push(newProduct);
            localStorage.setItem('adminProducts', JSON.stringify(customProducts));
            
            alert('Product added successfully! It will now appear first in the Shop.');
            this.reset();
        });

        document.addEventListener('DOMContentLoaded', loadOrders);
    </script>
</body>
</html>
