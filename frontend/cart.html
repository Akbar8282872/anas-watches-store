<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart | AFLAH STORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/global.css">
    <style>
        .cart-section {
            padding: 150px 5% 5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .cart-header {
            font-family: var(--font-heading);
            color: var(--gold);
            font-size: 2.5rem;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 1rem;
        }

        .cart-container {
            display: flex;
            gap: 3rem;
            flex-wrap: wrap;
        }

        .cart-items {
            flex: 2;
            min-width: 280px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            background-color: var(--dark-2);
            border: 1px solid var(--glass-border);
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            transition: border-color 0.3s;
        }

        .cart-item:hover { border-color: var(--gold); }

        .cart-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border: 1px solid var(--gold);
            margin-right: 1.5rem;
            border-radius: 4px;
        }

        .item-details h3 {
            font-family: var(--font-heading);
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        .item-price {
            color: var(--gold);
            font-weight: 600;
        }

        .remove-btn {
            margin-left: auto;
            color: #e74c3c;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            padding: 0.5rem;
            transition: transform 0.2s;
        }
        .remove-btn:hover { transform: scale(1.2); }

        .cart-summary {
            flex: 1;
            min-width: 260px;
            background-color: var(--dark-2);
            border: 1px solid var(--glass-border);
            padding: 2rem;
            border-radius: 8px;
            height: fit-content;
        }

        .cart-summary h3 {
            margin-bottom: 1.5rem;
            font-family: var(--font-heading);
            color: var(--gold);
            font-size: 1.3rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--glass-border);
            font-weight: 700;
            font-size: 1.2rem;
            color: var(--white);
        }

        .checkout-btn {
            width: 100%;
            background-color: var(--gold);
            color: #000;
            border: none;
            padding: 1rem;
            margin-top: 2rem;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.3s, transform 0.2s;
        }

        .checkout-btn:hover {
            background-color: var(--gold-light);
            transform: translateY(-2px);
        }

        /* Checkout Form Modal */
        .checkout-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.85);
            z-index: 9000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background-color: var(--dark-1);
            padding: 3rem;
            border: 1px solid var(--gold);
            border-radius: 8px;
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 30px 80px rgba(0,0,0,0.9);
        }

        .modal-content h2 {
            color: var(--gold);
            font-family: var(--font-heading);
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--muted);
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.9rem;
            background-color: var(--dark-3);
            border: 1px solid var(--glass-border);
            color: var(--white);
            border-radius: 4px;
            font-size: 0.9rem;
            transition: border-color 0.3s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--gold);
        }
        .form-group select option { background: var(--dark-1); }

        .payment-info {
            background-color: rgba(201,168,76,0.08);
            padding: 1rem 1.2rem;
            border-left: 3px solid var(--gold);
            border-radius: 0 4px 4px 0;
            margin-top: 0.5rem;
            font-size: 0.88rem;
            line-height: 1.8;
            display: none;
            color: var(--white);
        }
        .payment-info strong { color: var(--gold); }
    </style>

</head>
<body>
    <header class="navbar" id="navbar">
        <div class="logo">AFLAH <span>STORE</span></div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="cart.html" style="color: var(--color-gold);"><i class="fa-solid fa-cart-shopping"></i> Cart</a></li>
                <li><a href="contact.html"><i class="fa-solid fa-phone"></i> Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="cart-section">
        <h1 class="cart-header">Your Shopping Cart</h1>
        
        <div class="cart-container">
            <div class="cart-items" id="cartItemsContainer">
                <!-- Cart items injected via JS -->
            </div>
            
            <div class="cart-summary">
                <h3>Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">Rs. 0</span>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <span>Free</span>
                </div>
                <div class="summary-total">
                    <span>Total</span>
                    <span id="total">Rs. 0</span>
                </div>
                
                <hr style="border:0; border-top: 1px solid var(--glass-border); margin: 1.5rem 0;">
                
                <h3 style="font-size: 1.1rem; margin-bottom: 1rem;">Shipping & Payment</h3>
                <form id="checkoutForm">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" id="custName" required placeholder="Your full name">
                    </div>
                    <div class="form-group">
                        <label>Shipping Address</label>
                        <input type="text" id="custAddress" required placeholder="Address, City">
                    </div>
                    <div class="form-group">
                        <label>Phone Number <span style="color:var(--muted);font-size:0.75rem;">(Pakistani format: 0300-1234567)</span></label>
                        <input type="tel" id="custPhone" required placeholder="0300-1234567" maxlength="12" inputmode="numeric">
                    </div>
                    <div class="form-group">
                        <label>Payment Method</label>
                        <select id="paymentMethod" onchange="togglePaymentInfo()" required>
                            <option value="COD">Cash on Delivery (COD)</option>
                            <option value="Easypaisa">Easypaisa</option>
                            <option value="Jazzcash">Jazzcash</option>
                            <option value="BankTransfer">Online Bank Transfer</option>
                        </select>
                    </div>
                    
                    <div class="payment-info" id="paymentInfo" style="margin-bottom: 1rem;">
                        <div id="paymentInstructions">Please send the total amount to <strong>0343-3467891</strong>.</div><br>
                        <label>Transaction Reference ID:</label>
                        <input type="text" id="trxId" placeholder="Enter Ref #">
                    </div>
                    
                    <button type="submit" class="checkout-btn" style="margin-top: 1rem; width: 100%;">Place Order</button>
                </form>
            </div>
        </div>
    </section>

    <!-- Firebase Compat Libraries -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>

    <script>
        // Pakistani phone auto-format: 0300-1234567 (max 11 digits)
        document.addEventListener('DOMContentLoaded', function() {
            const phoneInput = document.getElementById('custPhone');
            phoneInput.addEventListener('input', function(e) {
                // Strip non-digits
                let digits = this.value.replace(/\D/g, '');
                // Max 11 digits
                if (digits.length > 11) digits = digits.slice(0, 11);
                // Insert dash after 4th digit
                if (digits.length > 4) {
                    this.value = digits.slice(0, 4) + '-' + digits.slice(4);
                } else {
                    this.value = digits;
                }
            });
            phoneInput.addEventListener('keydown', function(e) {
                // Allow: backspace, delete, tab, arrows, home, end
                if ([8,9,13,27,46,35,36,37,38,39,40].includes(e.keyCode)) return;
                // Block non-numeric keys (except dash already handled above)
                if ((e.shiftKey || (e.keyCode < 48 || e.keyCode > 57)) && (e.keyCode < 96 || e.keyCode > 105)) {
                    e.preventDefault();
                }
            });
        });

        function togglePaymentInfo() {
            const method = document.getElementById("paymentMethod").value;
            const info = document.getElementById("paymentInfo");
            const instructions = document.getElementById("paymentInstructions");
            if (method === "Easypaisa" || method === "Jazzcash") {
                info.style.display = "block";
                instructions.innerHTML = `Send the total to <strong>0343-3467891</strong> via <strong>${method}</strong>.`;
                document.getElementById("trxId").required = true;
            } else if (method === "BankTransfer") {
                info.style.display = "block";
                instructions.innerHTML = `Bank: <strong>Meezan Bank</strong><br>Account: <strong>03433467891</strong><br>Account Title: <strong>AFLAH STORE</strong><br>IBAN: <strong>PK36MEZN0001234567890123</strong>`;
                document.getElementById("trxId").required = true;
            } else {
                info.style.display = "none";
                document.getElementById("trxId").required = false;
            }
        }

        function loadCart() {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            const container = document.getElementById("cartItemsContainer");
            const subtotalEl = document.getElementById("subtotal");
            const totalEl = document.getElementById("total");

            if (cart.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center; padding: 4rem; color: var(--muted);">
                        <i class="fa-solid fa-cart-shopping" style="font-size:3rem; color: var(--gold); margin-bottom:1rem;"></i>
                        <p style="font-size:1.2rem;">Your cart is empty.</p>
                        <a href="shop.html" style="color:var(--gold); text-decoration:underline; margin-top:1rem; display:inline-block;">Browse the Collection</a>
                    </div>`;
                subtotalEl.innerText = "Rs. 0";
                totalEl.innerText = "Rs. 0";
                return;
            }

            let html = "";
            let total = 0;

            cart.forEach((item, index) => {
                let qty = item.quantity || 1;
                total += item.price * qty;
                html += `
                    <div class="cart-item">
                        <img src="${item.image}" alt="${item.name}">
                        <div class="item-details" style="flex:1;">
                            <h3>${item.name}</h3>
                            <div class="item-price">Rs. ${item.price.toLocaleString()}</div>
                        </div>
                        <div class="quantity-controls" style="display: flex; align-items: center; margin-right: 1.5rem;">
                            <button onclick="updateQuantity(${index}, -1)" style="background:var(--dark-3); color:var(--white); border:1px solid var(--glass-border); padding:0.5rem 0.8rem; cursor:pointer; border-radius: 4px;">-</button>
                            <span style="margin: 0 1rem; color:var(--white); font-weight:bold;">${qty}</span>
                            <button onclick="updateQuantity(${index}, 1)" style="background:var(--dark-3); color:var(--white); border:1px solid var(--glass-border); padding:0.5rem 0.8rem; cursor:pointer; border-radius: 4px;">+</button>
                        </div>
                        <button class="remove-btn" onclick="removeItem(${index})"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });

            container.innerHTML = html;
            subtotalEl.innerText = `Rs. ${total.toLocaleString()}`;
            totalEl.innerText = `Rs. ${total.toLocaleString()}`;
        }

        function updateQuantity(index, change) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            if (cart[index]) {
                let currentQty = cart[index].quantity || 1;
                let newQty = currentQty + change;
                if (newQty <= 0) {
                    cart.splice(index, 1);
                } else if (newQty > 10) {
                    alert("You cannot add more than 10 of this watch to your cart.");
                    newQty = 10;
                    cart[index].quantity = newQty;
                } else {
                    cart[index].quantity = newQty;
                }
                localStorage.setItem("cart", JSON.stringify(cart));
                loadCart();
            }
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            cart.splice(index, 1);
            localStorage.setItem("cart", JSON.stringify(cart));
            loadCart();
        }

        document.getElementById("checkoutForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            if (cart.length === 0) return alert("Cart is empty!");

            // Validate phone: must be exactly 11 digits (format: 0300-1234567 = 12 chars)
            const phoneVal = document.getElementById("custPhone").value;
            const phoneDigits = phoneVal.replace(/\D/g, '');
            if (phoneDigits.length !== 11) {
                alert("⚠️ Please enter a valid 11-digit Pakistani phone number (e.g. 0300-1234567)");
                document.getElementById("custPhone").focus();
                return;
            }


            let total = cart.reduce((sum, item) => sum + (item.price * (item.quantity || 1)), 0);
            const name = document.getElementById("custName").value;
            const address = document.getElementById("custAddress").value;
            const phone = document.getElementById("custPhone").value;
            const method = document.getElementById("paymentMethod").value;
            const trxId = document.getElementById("trxId").value;

            const newOrder = {
                orderId: 'ORD-' + Math.floor(Math.random() * 90000 + 10000),
                name, address, phone, method, trxId, total,
                status: 'Pending Verification',
                items: cart,
                timestamp: new Date().toISOString()
            };

            try {
                await window.db.collection("orders").add(newOrder);
                alert("✅ Order placed! Admin will verify your payment shortly.");
                localStorage.removeItem("cart");
                loadCart();
                document.getElementById("checkoutForm").reset();
                document.getElementById("paymentInfo").style.display = "none";
            } catch(error) {
                console.error("Firebase error:", error);
                alert("Could not place order via Firebase. Please check connection.");
            }
        });

        document.addEventListener("DOMContentLoaded", loadCart);
    </script>

    <!-- Floating WhatsApp Button -->
    <a href="https://wa.me/923433467891" class="whatsapp-btn" target="_blank" aria-label="Chat on WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>

<script src="js/cursor.js"></script>
</body>
</html>
